name: Generate profile summary cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: rubabijad
          BRANCH_NAME: main
          UTC_OFFSET: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
